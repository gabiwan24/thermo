<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#ffffff">
<title>papier / pocket print</title>
<link rel="preload" href="assets/papier-pixel.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body><div class="app-shell">
<header><h1 class="wordmark">papier_</h1><div class="header-actions"><button id="connection-chip" class="connection-chip" aria-label="Druckerverbindung öffnen">Offline</button><button id="menu-open" class="menu-button" aria-label="Systemeinstellungen" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></div></header>
<main>
<div class="content-head"><h2 id="content-title">Foto</h2></div>
<section class="preview-area" aria-label="Druckvorschau"><div class="preview-heading"><span class="preview-tag">DRUCKVORSCHAU</span><span id="dimensions">384 px</span><button id="edit-text" class="text-button" hidden>Bearbeiten</button></div>
<div class="paper"><div id="empty"><span id="empty-label">Kein Bild</span><button id="empty-action" class="secondary">Bild wählen</button></div><div id="text-editor" hidden>
<label class="field"><span class="sr-only">Etikettentext</span><textarea id="label-text" rows="3" maxlength="1000" placeholder="Dein Text..." aria-label="Etikettentext" spellcheck="false" aria-describedby="status"></textarea></label>

</div><div id="preview-scroll" tabindex="0" aria-label="Druckvorschau scrollen"><canvas id="preview" hidden aria-label="Schwarz-Weiß-Druckbild"></canvas></div></div>

<p id="status" role="status" aria-live="polite"></p></section>
<section class="studio">

<div class="sources"><button id="camera" class="primary"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg>Kamera</button><button id="choose" class="secondary"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg>Galerie</button></div>
<input id="file" type="file" accept="image/*" hidden><input id="capture-file" type="file" accept="image/*" capture="environment" hidden>

<details id="main-settings" class="main-settings"><summary>Einstellungen</summary><div id="text-settings" hidden><div class="row"><label class="field">Schrift<select id="text-font"><option value="pixel">Pixel</option><option value="sans">Sans</option><option value="mono">Mono</option></select></label><label class="field">Größe<select id="text-size"><option value="9">9 px</option><option value="18">18 px</option><option value="27" selected>27 px</option><option value="36">36 px</option><option value="45">45 px</option><option value="54">54 px</option></select></label></div>
<div class="row"><label class="field">Ausrichtung<select id="text-align"><option value="left">Links</option><option value="center">Mitte</option><option value="right">Rechts</option></select></label><label class="check"><input id="text-bold" type="checkbox" checked> Fett</label></div></div><div class="controls"><label class="field">Raster<select id="mode"></select></label><label class="field">Helligkeit <output id="brightness-value">0</output><input id="brightness" type="range" min="-80" max="80" value="0"></label>
<label class="field">Kontrast <output id="contrast-value">0</output><input id="contrast" type="range" min="-100" max="100" value="0"></label>
<div class="row tools"><button id="rotate" class="secondary" disabled>Drehen</button><label class="check"><input type="checkbox" id="border" checked> Rand</label><button id="reset" class="text-button" disabled>Stil reset</button></div></div><section id="comparison" class="comparison" aria-label="Rastervergleich"><details><summary>Rastervergleich</summary><div class="comparison-toolbar"><label class="check"><input id="detail" type="checkbox"> Detail</label><button id="demo" class="text-button">Testbild</button></div><div id="patterns" class="patterns"></div></details></section></details>
</section>



</main><div class="bottom-bar"><div class="input-modes bottom-nav" role="group" aria-label="Inhalt"><button id="photo-mode" aria-pressed="true">Foto</button><button id="text-mode" aria-pressed="false">Text</button></div><div class="print-actions"><button id="print" class="primary" disabled aria-describedby="status">Drucken</button></div></div><footer><span>papier / pocket print</span><span>v.01</span></footer></div>
<dialog id="system-menu" aria-labelledby="system-title"><div class="system-heading"><h2 id="system-title">System</h2><button id="menu-close" aria-label="Menü schließen">X</button></div><h2>Drucker</h2><p id="connection-state" role="status">Nicht verbunden</p><label class="field">Modell<select id="model"><option value="t02">Phomemo T02</option><option value="m02">Phomemo M02</option><option value="m02-pro">Phomemo M02 Pro</option><option value="m260">Phomemo M260</option></select></label><button id="connect" class="connection">Verbinden</button><h2>Ansicht & Export</h2><div class="preview-options"><label class="check"><input id="original-pixels" type="checkbox"> 1:1</label><button id="download" class="text-button" disabled>PNG speichern</button></div><p id="system-status" role="status" aria-live="polite"></p><p id="support" hidden></p></dialog>
<div class="portrait-guard" aria-label="Hochformat"><span aria-hidden="true">[ / ]</span>Hochformat</div>
<dialog id="camera-dialog" aria-label="Live-Kamera">
<video id="video" autoplay playsinline muted hidden></video>
<div class="camera-stage"><canvas id="camera-preview" aria-label="Live-Druckvorschau"></canvas></div>
<div class="camera-top"><span id="camera-resolution">...</span><button id="camera-switch" aria-label="Zur Selfie-Kamera wechseln" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v12H3z"/><path d="m9 11 3-2 3 2m0 4-3 2-3-2"/><path d="M12 9v8"/></svg><span>Selfie</span></button><button id="close-camera" aria-label="Kamera schließen">X</button></div>
<div class="camera-overlay">
<p id="camera-status" role="status" aria-live="polite"></p>
<div id="camera-adjustments" class="camera-adjustments" inert><div class="camera-adjustments-inner">
<label class="field">Helligkeit <output id="camera-brightness-value">0</output><input id="camera-brightness" type="range" min="-80" max="80" value="0"></label>
<label class="field">Kontrast <output id="camera-contrast-value">0</output><input id="camera-contrast" type="range" min="-100" max="100" value="0"></label>
<label class="field">Raster<select id="camera-mode"></select></label>
</div></div>
<div class="camera-toolbar"><button id="camera-toggle" aria-expanded="false" aria-controls="camera-adjustments">Regler <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m4 13 6-6 6 6"/></svg></button><button id="camera-rotate" aria-label="Bild drehen" title="Bild drehen"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12a12 12 0 1 1 0 10M5 4v8h8"/><path d="M13 13h8v11h-8z"/></svg></button></div>
<button id="shutter" class="primary" disabled>Auslösen</button>
</div></dialog>
<script type="module" src="app.js"></script></body></html>
