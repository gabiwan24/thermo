<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff">
<title>papier / pocket print</title>
<link rel="preload" href="assets/papier-pixel.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body><div class="app-shell">
<header><a class="wordmark" href="./" aria-label="Papier Startseite">papier_</a><button id="menu-open" class="menu-button" aria-label="Systemeinstellungen" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></header>
<main>
<section class="preview-area" aria-label="Druckvorschau"><div class="preview-heading"><span>Vorschau</span><span id="dimensions">384 px</span></div>
<div class="paper"><div id="empty"><span aria-hidden="true">[ + ]</span></div><div id="preview-scroll"><canvas id="preview" hidden aria-label="Schwarz-Weiß-Druckbild"></canvas></div></div>
<div class="preview-options"><label class="check"><input id="original-pixels" type="checkbox"> 1:1</label><button id="download" class="text-button" disabled>PNG speichern</button></div>
<div class="print-actions"><button id="print" class="primary" disabled>Drucken</button></div></section>
<section class="studio">

<div class="sources"><button id="camera" class="primary">Kamera</button><button id="choose" class="secondary">Galerie</button></div>
<input id="file" type="file" accept="image/*" hidden><input id="capture-file" type="file" accept="image/*" capture="environment" hidden>
<div id="text-editor" hidden>
<label class="field">Text<textarea id="label-text" rows="3" maxlength="1000" placeholder="Dein Text..."></textarea></label>

</div>
<details id="main-settings" class="main-settings"><summary>Einstellungen</summary><div id="text-settings" hidden><div class="row"><label class="field">Schrift<select id="text-font"><option value="pixel">Pixel</option><option value="sans">Sans</option><option value="mono">Mono</option></select></label><label class="field">Größe<select id="text-size"><option value="9">9 px</option><option value="18">18 px</option><option value="27" selected>27 px</option><option value="36">36 px</option><option value="45">45 px</option><option value="54">54 px</option></select></label></div>
<div class="row"><label class="field">Ausrichtung<select id="text-align"><option value="left">Links</option><option value="center">Mitte</option><option value="right">Rechts</option></select></label><label class="check"><input id="text-bold" type="checkbox" checked> Fett</label></div></div><div class="controls"><label class="field">Raster<select id="mode"></select></label><label class="field">Helligkeit <output id="brightness-value">0</output><input id="brightness" type="range" min="-80" max="80" value="0"></label>
<label class="field">Kontrast <output id="contrast-value">0</output><input id="contrast" type="range" min="-100" max="100" value="0"></label>
<div class="row tools"><button id="rotate" class="secondary" disabled>Drehen</button><label class="check"><input type="checkbox" id="border" checked> Rand</label><button id="reset" class="text-button" disabled>Reset</button></div></div><section id="comparison" class="comparison" aria-label="Rastervergleich"><details><summary>Rastervergleich</summary><div class="comparison-toolbar"><label class="check"><input id="detail" type="checkbox"> Detail</label><button id="demo" class="text-button">Testbild</button></div><div id="patterns" class="patterns"></div></details></section></details>
</section>

<p id="status" role="status" aria-live="polite"></p><p id="support" hidden></p>


</main><div class="input-modes bottom-nav" role="group" aria-label="Inhalt"><button id="photo-mode" aria-pressed="true">Foto</button><button id="text-mode" aria-pressed="false">Text</button></div><footer><span>papier / pocket print</span><span>v.01</span></footer></div>
<dialog id="system-menu" aria-labelledby="system-title"><div class="system-heading"><h2 id="system-title">System</h2><button id="menu-close" aria-label="Menü schließen">X</button></div><h2>Drucker</h2><label class="field">Modell<select id="model"><option value="t02">Phomemo T02</option><option value="m02">Phomemo M02</option><option value="m02-pro">Phomemo M02 Pro</option><option value="m260">Phomemo M260</option></select></label><button id="connect" class="connection">Verbinden</button></dialog>
<div class="portrait-guard" aria-label="Hochformat"><span aria-hidden="true">[ / ]</span>Hochformat</div>
<dialog id="camera-dialog" aria-label="Live-Kamera">
<video id="video" autoplay playsinline muted hidden></video>
<div class="camera-stage"><canvas id="camera-preview" aria-label="Live-Druckvorschau"></canvas></div>
<div class="camera-top"><span id="camera-resolution">...</span><button id="close-camera" aria-label="Kamera schließen">X</button></div>
<div class="camera-overlay">
<div id="camera-adjustments" class="camera-adjustments" inert><div class="camera-adjustments-inner">
<label class="field">Helligkeit <output id="camera-brightness-value">0</output><input id="camera-brightness" type="range" min="-80" max="80" value="0"></label>
<label class="field">Kontrast <output id="camera-contrast-value">0</output><input id="camera-contrast" type="range" min="-100" max="100" value="0"></label>
<label class="field">Raster<select id="camera-mode"></select></label>
</div></div>
<div class="camera-toolbar"><button id="camera-toggle" aria-expanded="false" aria-controls="camera-adjustments">Regler <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m4 13 6-6 6 6"/></svg></button><button id="camera-rotate" aria-label="Bild drehen" title="Bild drehen"><svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12a12 12 0 1 1 0 10M5 4v8h8"/><path d="M13 13h8v11h-8z"/></svg></button></div>
<button id="shutter" class="primary" disabled>Auslösen</button>
</div></dialog>
<script type="module" src="app.js"></script></body></html>
